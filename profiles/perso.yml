# Profil « perso » : poste personnel, orienté bureautique et multimédia.
profile_roles:
  - desktop
  - dev

workstation_full_name: "Adrien Bouchardon"
workstation_email: "{{ vault_perso_email | default('adrien.bouchardon@gmail.com') }}"

# Applications graphiques propres au poste perso : elles s'ajoutent au
# socle commun de profiles/common.yml (firefox, keepassxc).
