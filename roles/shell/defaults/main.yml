---
# Shell interactif installé et défini comme shell de connexion.
# Valeurs possibles : bash, zsh.
shell_default: zsh

# Change réellement le shell de connexion de l'utilisateur.
shell_set_as_login_shell: true

# Invite de commande Starship (installée via le gestionnaire de paquets).
shell_install_starship: true

# Version installée quand la distribution ne fournit pas de paquet Starship.
shell_starship_version: "1.23.0"

# Alias de base, déployés dans ~/.config/shell/aliases.sh.
# Clé = alias, valeur = commande.
# Les alias effectivement déployés sont fusionnés dans cet ordre, le dernier
# l'emportant en cas de clé identique : shell_aliases, puis
# shell_common_aliases (profiles/common.yml), puis shell_profile_aliases
# (profiles/<profil>.yml). Pour AJOUTER un alias, utiliser l'une des deux
# dernières variables plutôt que de redéfinir shell_aliases (qui serait
# remplacée en bloc).
shell_aliases:
  ll: "ls -alFh"
  la: "ls -A"
  "..": "cd .."
  "...": "cd ../.."
  gs: "git status --short --branch"
  gl: "git log --oneline --graph --decorate -20"
  gd: "git diff"
  ff: "fd"

# Alias propres au tronc commun (à définir dans profiles/common.yml).
shell_common_aliases: {}

# Alias propres au profil (à définir dans profiles/<profil>.yml).
shell_profile_aliases: {}

# Variables d'environnement déployées dans ~/.config/shell/exports.sh.
shell_exports:
  EDITOR: vim
  VISUAL: vim
  LESS: "-R"

# Répertoire des fragments de configuration sourcés par les rc.
shell_config_dir: "{{ workstation_home }}/.config/shell"
