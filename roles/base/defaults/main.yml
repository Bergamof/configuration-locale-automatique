---
# Paquets présents sur tous les postes, quels que soient l'OS et le profil.
# Les noms réels sont résolus par distribution dans vars/<famille>.yml ;
# cette liste contient les identifiants logiques du rôle.
base_tools:
  - curl
  - wget
  - unzip
  - tree
  - htop
  - jq
  - ripgrep
  - fd
  - bat
  - vim

# Paquets supplémentaires, alimentés par un profil (profiles/*.yml).
base_extra_packages: []

# Gestion de la localisation. Désactivable si le poste est déjà réglé.
base_manage_timezone: true
base_manage_locale: true

# Durée de validité du cache de paquets, en secondes (apt uniquement).
base_cache_valid_time: 3600

# Mise à niveau complète du système avant toute installation
# (pacman uniquement). À laisser à true : Arch et Manjaro ne prennent pas
# en charge les mises à jour partielles, et une installation faite sur une
# base de données synchronisée mais un système non mis à niveau échoue sur
# un conflit de dépendances. Passer à false n'est cohérent que pour un
# poste déjà à jour : la base de données pacman n'est alors pas
# rafraîchie non plus.
base_system_upgrade: true
