[defaults]
inventory = inventory/hosts.yml
roles_path = roles
collections_path = collections
result_format = yaml
callbacks_enabled = ansible.posix.profile_tasks
interpreter_python = auto_silent

# Les faits ne sont plus injectés en variables de haut niveau : on y accède
# explicitement via ansible_facts['...']. C'est le comportement par défaut
# à partir d'ansible-core 2.24, et cela supprime l'avertissement de
# dépréciation INJECT_FACTS_AS_VARS émis à chaque tâche par les versions
# récentes. Toute réintroduction d'un `ansible_<fait>` échouera donc
# immédiatement, au lieu de passer inaperçue.
inject_facts_as_vars = false
force_color = true
nocows = true
retry_files_enabled = false
display_skipped_hosts = false

[privilege_escalation]
become_ask_pass = false

[ssh_connection]
pipelining = true
